apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: finalizers
spec:
  version: {{ .TagName }}
  homepage: https://github.com/tremes/kubectl-finalizers
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/tremes/kubectl-finalizers/releases/download/{{ .TagName }}/kubectl-finalizers_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
    bin: kubectl-finalizers
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/tremes/kubectl-finalizers/releases/download/{{ .TagName }}/kubectl-finalizers_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
    bin: kubectl-finalizers
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/tremes/kubectl-finalizers/releases/download/{{ .TagName }}/kubectl-finalizers_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
    bin: kubectl-finalizers
  shortDescription: Evicts the given pod
  description: |
    Usage:
      kubectl finalizers -n <namespace-name>
      A kubectl plugin for discovering and fixing resources blocked by pending finalizers.

